name: Build PDF

on:
  push:
    branches:
      - main
      - add-footnotes
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # Cache apt packages
      - name: Cache apt packages
        uses: actions/cache@v3
        id: cache-apt
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-texlive-pandoc-${{ hashFiles('.github/workflows/**') }}
          restore-keys: |
            ${{ runner.os }}-apt-texlive-pandoc-
            ${{ runner.os }}-apt-

      # Only install if cache miss
      - name: Install dependencies
        if: steps.cache-apt.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended pandoc

      # Ensure packages are available even with cache hit
      - name: Verify installations
        run: |
          which pandoc
          which pdflatex

      - name: Run PDF generation script
        run: |
          chmod +x scripts/build-aaron-lbc-pdf.sh
          scripts/build-aaron-lbc-pdf.sh

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: lbc1689_aab
          path: build*/*