name: Build PDF

on:
  push:
    branches:
      - main
      - add-footnotes
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended
          sudo apt-get install -y pandoc

      - name: Run PDF generation script
        run: |
          chmod +x scripts/build-aaron-lbc-pdf.sh
          scripts/build-aaron-lbc-pdf.sh

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: lbc1689_aab.pdf
          path: build