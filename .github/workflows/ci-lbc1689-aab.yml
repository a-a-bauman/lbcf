name: Build PDF

on:
  push:
    branches:
      - main
      - add-footnotes
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # Cache apt packages
      - name: Cache apt packages
        uses: actions/cache@v3
        id: cache-apt
        with:
          path: |
            ~/apt-cache
          key: ${{ runner.os }}-apt-texlive-pandoc-
          restore-keys: |
            ${{ runner.os }}-apt-texlive-pandoc-
            ${{ runner.os }}-apt-

      # Only install if cache miss
      - name: Install dependencies
        if: steps.cache-apt.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          # Download packages to our cache directory
          sudo apt-get install -y texlive-latex-recommended pandoc
          # Copy downloaded packages to our cache directory
          mkdir -p ~/apt-cache
          sudo cp /var/cache/apt/archives/*.deb ~/apt-cache/

      # Install from cache if available
      - name: Install from cache
        if: steps.cache-apt.outputs.cache-hit == 'true'
        run: |
          sudo dpkg -i ~/apt-cache/*.deb || true
          sudo apt-get install -f -y  # Fix any dependency issues

      # Ensure packages are available even with cache hit
      - name: Verify installations
        run: |
          which pandoc
          which pdflatex

      - name: Run PDF generation script
        run: |
          chmod +x scripts/lbc1689-aab-build.sh
          scripts/lbc1689-aab-build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lbc1689_aab
          path: build*/*